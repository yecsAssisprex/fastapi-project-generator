
  db:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-{{PROJECT_SNAKE}}}
    ports:
      # Publicado para poder conectarse con psql desde la maquina. Quitalo si el
      # puerto 5432 del host ya lo ocupa otro Postgres.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-{{PROJECT_SNAKE}}}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
